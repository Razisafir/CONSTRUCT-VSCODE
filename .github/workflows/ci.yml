name: CI

on:
  push:
    branches: [main, audit/*]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch — saves CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construct-unit-tests:
    name: Construct Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install test-only dependencies
        # We only need mocha + ts-node + typescript to run the construct unit tests.
        # Full npm install requires ~3GB and 10+ minutes; we skip it for CI speed.
        run: |
          npm install --no-save --no-package-lock \
            mocha@^10.2.0 \
            ts-node@^10.9.1 \
            typescript@^5.1.0 \
            @types/mocha@^9.1.1 \
            @types/node@^20.0.0

      - name: Run construct unit tests
        env:
          # KOVIX package.json has "type": "module" which makes Node treat
          # .ts files as ESM. The construct tests use CommonJS (suite/test
          # TDD interface). We isolate them in a temp dir to avoid the
          # package.json type conflict.
          TS_NODE_TRANSPILE_ONLY: 'true'
        run: |
          # Set up isolated test environment that doesn't inherit type:module
          mkdir -p /tmp/kovix-test-isolated/src /tmp/kovix-test-isolated/test

          # Copy the helper source files (zero VS Code deps)
          cp src/vs/platform/construct/common/editor/kovixInlineCompletionHelpers.ts /tmp/kovix-test-isolated/src/
          cp src/vs/platform/construct/common/agent/promptSanitizer.ts /tmp/kovix-test-isolated/src/

          # Copy all test files
          cp test/unit/construct/services/*.test.ts /tmp/kovix-test-isolated/test/
          cp test/unit/construct/agent/*.test.ts /tmp/kovix-test-isolated/test/ 2>/dev/null || true

          # Fix imports to point to the local src dir, drop .js extensions
          sed -i 's|../../../../src/vs/platform/construct/common/editor/kovixInlineCompletionHelpers.js|../src/kovixInlineCompletionHelpers|g' /tmp/kovix-test-isolated/test/*.test.ts
          sed -i 's|../../../../src/vs/platform/construct/common/agent/promptSanitizer.js|../src/promptSanitizer|g' /tmp/kovix-test-isolated/test/*.test.ts

          # Symlink node_modules from the main checkout
          ln -sf "$(pwd)/node_modules" /tmp/kovix-test-isolated/node_modules

          # Write a CommonJS package.json (no type:module)
          cat > /tmp/kovix-test-isolated/package.json << 'PKGJSON'
          {
            "name": "kovix-test-isolated",
            "version": "1.0.0",
            "private": true
          }
          PKGJSON

          # Write a minimal tsconfig
          cat > /tmp/kovix-test-isolated/tsconfig.json << 'TSJSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "commonjs",
              "moduleResolution": "node",
              "esModuleInterop": true,
              "strict": true,
              "skipLibCheck": true,
              "types": ["mocha", "node"]
            },
            "include": ["test/**/*.ts", "src/**/*.ts"]
          }
          TSJSON

          # Run mocha with TDD interface (suite/test) — required for the existing tests
          cd /tmp/kovix-test-isolated
          npx mocha --require ts-node/register --ui tdd --timeout 10000 --reporter spec 'test/**/*.test.ts'

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node }}
          path: /tmp/kovix-test-isolated/
          retention-days: 7

  compile-check:
    name: TypeScript Compile Check (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # Full VS Code compile is heavy; treat as informational for now

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check that new construct source files are syntactically valid TypeScript
        # We don't do a full VS Code compile (needs 8GB heap + 25+ min).
        # Instead we type-check just the new files using tsc --noEmit on a
        # minimal tsconfig that skips lib checks.
        run: |
          npx -y typescript@5.4 --noEmit --strict --skipLibCheck \
            --module commonjs --moduleResolution node --target ES2022 \
            --esModuleInterop --resolveJsonModule \
            src/vs/platform/construct/common/editor/kovixInlineCompletionHelpers.ts \
            2>&1 | tee /tmp/compile.log || true

          # If the helpers file compiles cleanly, we're good. The provider
          # and inlineAgent files have VS Code imports we can't resolve
          # without the full dependency tree, so we skip them in CI for now.
          if grep -q "error TS" /tmp/compile.log; then
            echo "TypeScript errors found in helpers file"
            cat /tmp/compile.log
            exit 1
          fi
          echo "Helpers file compiles cleanly."
