name: Build Verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'src/vs/platform/construct/**'
      - 'src/vs/workbench/contrib/construct/**'
      - 'test/unit/construct/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  compile-check:
    name: TypeScript Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-compileNodeModules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: TypeScript Compile Check
        run: node_modules/.bin/tsc --noEmit

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-lintNodeModules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: ESLint Check (Construct files only)
        run: npx eslint src/vs/platform/construct/ src/vs/workbench/contrib/construct/ --max-warnings=0 || true

  construct-tests:
    name: Construct Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-testNodeModules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Run Construct Unit Tests
        run: npm run test-unit-construct

  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for stale Kovix+MIT headers
        run: |
          STALE=$(grep -rn "Copyright (c) Kovix" src/vs/platform/construct/ src/vs/workbench/contrib/construct/ 2>/dev/null || true)
          if [ -n "$STALE" ]; then
            echo "ERROR: Found stale 'Copyright (c) Kovix' headers:"
            echo "$STALE"
            exit 1
          fi
          echo "OK: No stale Kovix headers found"

      - name: Check for Math.random in security files
        run: |
          UNSAFE=$(grep -rn "Math\.random()" src/vs/platform/construct/common/security/ src/vs/platform/construct/common/terminal/ 2>/dev/null || true)
          if [ -n "$UNSAFE" ]; then
            echo "ERROR: Found Math.random() in security files:"
            echo "$UNSAFE"
            exit 1
          fi
          echo "OK: No Math.random() in security files"

  security-audit:
    name: npm Audit (Critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: npm audit (critical only)
        run: npm audit --audit-level=critical

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-bundleNodeModules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Compile and check bundle
        run: |
          npm run compile
          echo "Bundle compilation completed successfully"
